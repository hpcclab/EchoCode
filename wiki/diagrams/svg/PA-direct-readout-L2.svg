  <rect x="1204.0" y="178.0" width="322.0" height="74.0" rx="6" fill="#ffffff" stroke="#5d9161"/>
  <text x="1365.0" y="207.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">formatHelpByGuidance() where the</text>
  <text x="1365.0" y="222.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">output is an explanation</text>
  <rect x="1204.0" y="266.0" width="322.0" height="74.0" rx="6" fill="#ffffff" stroke="#5d9161"/>
  <text x="1365.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">speakMessage() — interrupts the</text>
  <text x="1365.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">current utterance, waits for exit,</text>
