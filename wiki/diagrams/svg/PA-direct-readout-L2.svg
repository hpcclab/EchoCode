  <text x="225.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Keybinding filtered by when-clause</text>
  <text x="225.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">editorTextFocus &amp;&amp; echocode:isDev</text>
  <text x="225.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">locked shortcuts never dispatch</text>
  <rect x="64.0" y="266.0" width="322.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
