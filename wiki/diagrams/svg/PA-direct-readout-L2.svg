  <text x="985.0" y="529.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#333333" text-anchor="middle" dominant-baseline="middle">(character read-out only)</text>
  <rect x="430.0" y="566.0" width="350.0" height="60.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="605.0" y="588.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">No active editor, or empty line</text>
  <text x="605.0" y="603.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">— spoken, not silent</text>
  <path d="M 50.0 790.0 H 1516.0 L 1530.0 804.0 V 874.0 H 50.0 Z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M 1516.0 790.0 V 804.0 H 1530.0" fill="none" stroke="#d6b656"/>
  <text x="59.0" y="805.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">Character read-out is the one variant that is not command-driven: it subscribes to onDidChangeTextDocument and speaks the character left of the cursor after each change. The listener is disposed when toggled off, not merely</text>
  <text x="59.0" y="820.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">flagged inactive, or it would run on every keystroke in every document for the rest of the session.</text>
