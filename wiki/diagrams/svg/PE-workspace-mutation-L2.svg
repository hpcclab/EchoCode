  <text x="50.0" y="59.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26.0" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Pattern E — Workspace Mutation</text>
  <text x="50.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.0" font-weight="normal" font-style="normal" fill="#6a6a6a" dominant-baseline="middle">Level 2 · each stage decomposed into the functions, decisions and failure paths that implement it</text>
  <rect x="1460.0" y="36.0" width="70.0" height="70.0" rx="6" fill="#d6ead7" stroke="#5d9161"/>
  <text x="1495.0" y="71.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30.0" font-weight="bold" fill="#333333" text-anchor="middle" dominant-baseline="middle">E</text>
  <rect x="64.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="194.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">getCurrentFolder() from the folder</text>
  <text x="194.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">navigator — deliberately not</text>
  <text x="194.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">workspaceFolders[0]</text>
  <rect x="64.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="194.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">file connector instead resolves the</text>
  <text x="194.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">symbol under the cursor via</text>
  <text x="194.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">findFunctionAtPosition()</text>
  <rect x="367.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="497.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">showInputBox with validateInput,</text>
  <text x="497.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">so an invalid name is rejected</text>
  <text x="497.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">before the user commits</text>
  <rect x="367.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="497.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">connector: two-step handoff —</text>
  <text x="497.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">copy stores a pending connection,</text>
  <text x="497.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">paste consumes it</text>
  <rect x="670.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="800.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">existsSync guard — never overwrite</text>
  <text x="800.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">(a TOCTOU race in principle, human</text>
  <text x="800.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">interaction in practice)</text>
  <rect x="670.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="800.0" y="295.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">areExtensionsCompatible(src, dest)</text>
  <text x="800.0" y="310.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">refuses cross-language connections</text>
  <rect x="973.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="1103.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">writeFile / mkdir for creation</text>
  <rect x="973.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="1103.0" y="280.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">_ensureCppHeader() writes a header</text>
  <text x="1103.0" y="295.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">the user did not ask for: create,</text>
  <text x="1103.0" y="310.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">append, or leave alone — must stay</text>
  <text x="1103.0" y="326.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">idempotent across repeat runs</text>
  <rect x="1276.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#5d9161"/>
  <text x="1406.0" y="207.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">open the new document with the</text>
  <text x="1406.0" y="222.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">cursor in it</text>
  <rect x="1276.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#5d9161"/>
  <text x="1406.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">speak confirmation and show an</text>
  <text x="1406.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">information message — both, so a</text>
  <text x="1406.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">sighted collaborator sees it too</text>
  <path d="M 353.0 409.3 A 144.0 7.3 0 0 1 641.0 409.3 V 450.7 A 144.0 7.3 0 0 1 353.0 450.7 Z" fill="#d5e8d4" stroke="#82b366"/>
  <path d="M 353.0 409.3 A 144.0 7.3 0 0 0 641.0 409.3" fill="none" stroke="#82b366"/>
  <text x="497.0" y="426.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#333333" text-anchor="middle" dominant-baseline="middle">Pending connection</text>
  <text x="497.0" y="441.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#333333" text-anchor="middle" dominant-baseline="middle">(module state, lost on reload)</text>
  <rect x="656.0" y="478.0" width="288.0" height="60.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="800.0" y="508.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Refusals are spoken, not silent</text>
  <path d="M 50.0 790.0 H 1516.0 L 1530.0 804.0 V 874.0 H 50.0 Z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M 1516.0 790.0 V 804.0 H 1530.0" fill="none" stroke="#d6b656"/>
  <text x="59.0" y="805.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">_ensureCppHeader is the highest-risk function in the pattern: it is the only place EchoCode creates a file the user did not name. Running the command twice must not duplicate a declaration, so any change there needs its</text>
  <text x="59.0" y="820.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">idempotency checked.</text>
</svg>
