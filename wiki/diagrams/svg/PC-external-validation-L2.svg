  <text x="59.0" y="805.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">Measured pylint cost: ~320ms on 48 lines, ~385ms on 498, ~635ms on 1998. Roughly 300ms of that is fixed interpreter and astroid startup, independent of file size — which is why debouncing saves helps far more than</text>
