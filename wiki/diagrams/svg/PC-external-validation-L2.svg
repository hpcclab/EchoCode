  <rect x="367.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="497.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">isPylintAvailable() — cached</text>
  <text x="497.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">re-spawning an interpreter per save</text>
