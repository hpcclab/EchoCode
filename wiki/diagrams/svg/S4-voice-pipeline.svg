  <text x="69.0" y="545.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.0" fill="#6b5c22" dominant-baseline="middle">Transcription runs in an isolated Python environment EchoCode bootstraps once. A question-shaped utterance is routed</text>
  <text x="69.0" y="561.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.0" fill="#6b5c22" dominant-baseline="middle">to the tutor even in command mode, so “how do I open a terminal?” is answered rather than executed.</text>
  <rect x="1000.0" y="540.0" width="530.0" height="80.0" rx="6" fill="#d6ead7" stroke="#5d9161"/>
  <text x="1265.0" y="570.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Local speech-to-text is the privacy boundary:</text>
  <text x="1265.0" y="589.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">no audio, and no code, leaves the device on this path.</text>
