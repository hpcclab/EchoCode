<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#555555"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="50.0" y="140.0" width="288.0" height="222.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="62.0" y="155.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="bold" fill="#555555" letter-spacing="0.6">D.1  Capture</text>
  <rect x="353.0" y="140.0" width="288.0" height="222.0" rx="4" fill="#fdf0fb" stroke="#c264a8"/>
  <text x="365.0" y="155.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="bold" fill="#555555" letter-spacing="0.6">D.2  Transcribe</text>
  <rect x="656.0" y="140.0" width="288.0" height="222.0" rx="4" fill="#fdf0fb" stroke="#c264a8"/>
  <text x="668.0" y="155.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="bold" fill="#555555" letter-spacing="0.6">D.3  Normalise &amp; reject</text>
  <rect x="959.0" y="140.0" width="288.0" height="222.0" rx="4" fill="#fdf0fb" stroke="#c264a8"/>
  <text x="971.0" y="155.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="bold" fill="#555555" letter-spacing="0.6">D.4  Score intent</text>
  <rect x="1262.0" y="140.0" width="288.0" height="222.0" rx="4" fill="#fdf0fb" stroke="#c264a8"/>
  <text x="1274.0" y="155.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="bold" fill="#555555" letter-spacing="0.6">D.5  Route</text>
  <path d="M 338.0 195.5 L 356.0 195.5 L 345.5 195.5 L 335.0 195.5 L 353.0 195.5" fill="none" stroke="#555555" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 641.0 195.5 L 659.0 195.5 L 648.5 195.5 L 638.0 195.5 L 656.0 195.5" fill="none" stroke="#555555" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 944.0 195.5 L 962.0 195.5 L 951.5 195.5 L 941.0 195.5 L 959.0 195.5" fill="none" stroke="#555555" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 1247.0 195.5 L 1265.0 195.5 L 1254.5 195.5 L 1244.0 195.5 L 1262.0 195.5" fill="none" stroke="#555555" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 439.4 362.0 L 439.4 380.0 L 439.4 382.0 L 497.0 382.0 L 497.0 384.0 L 497.0 402.0" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 857.6 362.0 L 857.6 380.0 L 857.6 420.0 L 800.0 420.0 L 800.0 460.0 L 800.0 478.0" fill="none" stroke="#b85450" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="50.0" y="59.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26.0" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Pattern D — Voice Intake</text>
  <text x="50.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.0" font-weight="normal" font-style="normal" fill="#6a6a6a" dominant-baseline="middle">Level 2 · each stage decomposed into the functions, decisions and failure paths that implement it</text>
  <rect x="1460.0" y="36.0" width="70.0" height="70.0" rx="6" fill="#fdf0fb" stroke="#c264a8"/>
  <text x="1495.0" y="71.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30.0" font-weight="bold" fill="#333333" text-anchor="middle" dominant-baseline="middle">D</text>
  <rect x="64.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="194.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">ffmpeg-static — no system dependency</text>
  <text x="194.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Windows: -f dshow -i audio=&lt;name&gt;</text>
  <text x="194.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">macOS: -f avfoundation -i :0</text>
  <rect x="64.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="194.0" y="295.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">16kHz mono, which is what Whisper</text>
  <text x="194.0" y="310.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">wants. No Linux branch exists.</text>
  <rect x="367.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="497.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">spawn python local_whisper_stt.py</text>
  <text x="497.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">WhisperModel('base.en', cpu, int8)</text>
  <text x="497.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">quantised to run without a GPU</text>
  <rect x="367.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="497.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">stdout is the transcript, stderr is</text>
  <text x="497.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">diagnostics — printing debug output</text>
  <text x="497.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">to stdout corrupts the result</text>
  <rect x="670.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="800.0" y="207.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">lowercase, strip punctuation,</text>
  <text x="800.0" y="222.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">collapse whitespace</text>
  <rect x="670.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="800.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">discard empty and no-speech</text>
  <text x="800.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">transcripts before anything</text>
  <text x="800.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">is dispatched</text>
  <rect x="973.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="1103.0" y="199.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">levenshtein · jaccard · token</text>
  <text x="1103.0" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">alignment · sliding window,</text>
  <text x="1103.0" y="230.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">combined into one score</text>
  <rect x="973.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="1103.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">threshold scales with length:</text>
  <text x="1103.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">0.85 for one word, 0.62 for more —</text>
  <text x="1103.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">so one mumbled syllable fires nothing</text>
  <rect x="1276.0" y="178.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="1406.0" y="207.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">question-shaped? → Chat Tutor,</text>
  <text x="1406.0" y="222.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">even in command mode</text>
  <rect x="1276.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="1406.0" y="287.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">match ≥ threshold → executeCommand</text>
  <text x="1406.0" y="303.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">else → generateCodeFromVoice()</text>
  <text x="1406.0" y="318.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">and insert at the cursor</text>
  <path d="M 353.0 409.3 A 144.0 7.3 0 0 1 641.0 409.3 V 450.7 A 144.0 7.3 0 0 1 353.0 450.7 Z" fill="#d5e8d4" stroke="#82b366"/>
  <path d="M 353.0 409.3 A 144.0 7.3 0 0 0 641.0 409.3" fill="none" stroke="#82b366"/>
  <text x="497.0" y="426.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#333333" text-anchor="middle" dominant-baseline="middle">Python interpreter path</text>
  <text x="497.0" y="441.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#333333" text-anchor="middle" dominant-baseline="middle">(globalState)</text>
  <rect x="656.0" y="478.0" width="288.0" height="60.0" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="800.0" y="500.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Empty or no-speech transcript</text>
  <text x="800.0" y="515.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">discarded, never dispatched</text>
  <path d="M 50.0 790.0 H 1516.0 L 1530.0 804.0 V 874.0 H 50.0 Z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M 1516.0 790.0 V 804.0 H 1530.0" fill="none" stroke="#d6b656"/>
  <text x="59.0" y="805.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">The dependency bootstrap is guarded hard: one attempt per extension host, a cross-window lock file, bounded timeouts on every shell-out, and a limit of two failed attempts before it asks rather than re-downloading. Those</text>
  <text x="59.0" y="820.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">guards exist because each was a real failure mode.</text>
</svg>
