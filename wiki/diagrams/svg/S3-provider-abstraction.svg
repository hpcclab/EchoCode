  <text x="1240.0" y="330.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="italic" fill="#7a7a7a" dominant-baseline="middle">on-device · no quota · offline</text>
  <rect x="900.0" y="420.0" width="320.0" height="78.0" rx="6" fill="#f0e6fa" stroke="#9673a6"/>
  <text x="1060.0" y="448.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Hosted API</text>
  <text x="1060.0" y="469.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">OpenAI-compatible or Anthropic</text>
  <text x="1240.0" y="460.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="italic" fill="#7a7a7a" dominant-baseline="middle">bring your own key · two wire formats</text>
  <path d="M 470.0 520.0 H 1206.0 L 1220.0 534.0 V 616.0 H 470.0 Z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M 1206.0 520.0 V 534.0 H 1220.0" fill="none" stroke="#d6b656"/>
  <text x="479.0" y="535.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.0" fill="#6b5c22" dominant-baseline="middle">The research question is efficiency: Copilot costs the user nothing extra, Ollama costs nothing at all</text>
  <text x="479.0" y="551.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.0" fill="#6b5c22" dominant-baseline="middle">and never leaves the machine, and a hosted key is the fallback. Provider choice is verified before it</text>
  <text x="479.0" y="568.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.0" fill="#6b5c22" dominant-baseline="middle">is saved.</text>
