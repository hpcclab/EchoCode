  <text x="1060.0" y="188.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">GitHub Copilot</text>
  <text x="1060.0" y="209.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">via vscode.lm</text>
  <text x="1240.0" y="200.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="italic" fill="#7a7a7a" dominant-baseline="middle">no API key · uses the user's entitlement</text>
  <rect x="900.0" y="290.0" width="320.0" height="78.0" rx="6" fill="#f0e6fa" stroke="#9673a6"/>
  <text x="1060.0" y="318.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">Ollama</text>
