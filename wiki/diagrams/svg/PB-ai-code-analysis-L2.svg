  <text x="1103.0" y="515.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">— the fragile seam</text>
  <path d="M 50.0 790.0 H 1516.0 L 1530.0 804.0 V 874.0 H 50.0 Z" fill="#fff2cc" stroke="#d6b656"/>
  <path d="M 1516.0 790.0 V 804.0 H 1530.0" fill="none" stroke="#d6b656"/>
  <text x="59.0" y="805.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">The parse step is where this pattern breaks in practice. Models return findings wrapped in prose or fenced code, sometimes truncated, so a plain JSON.parse discards everything. If annotations stop appearing after a prompt</text>
  <text x="59.0" y="820.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" fill="#6b5c22" dominant-baseline="middle">or model change, the request almost certainly succeeded and the parse dropped it.</text>
