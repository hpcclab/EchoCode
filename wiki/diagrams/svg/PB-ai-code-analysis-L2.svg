  <rect x="973.0" y="266.0" width="260.0" height="74.0" rx="6" fill="#ffffff" stroke="#c264a8"/>
  <text x="1103.0" y="295.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#222222" text-anchor="middle" dominant-baseline="middle">cleanResponse()</text>
